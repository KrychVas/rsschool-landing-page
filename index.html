<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee House</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Шапка сайту (спільна для обох сторінок) -->
    <header class="site-header" id="top">
    <div class="container header-menu">
      <a href="#top" class="logo" aria-label="Resource Coffee House">
        <img src="assets/icons/logo.svg" alt="Resource Coffee House" width="100" height="60">
      </a>

      <nav class="nav" aria-label="Main navigation">
        <a class="menu-item" href="#favorite-coffee">Favorite coffee</a>
        <a class="menu-item" href="#about">About</a>
        <a class="menu-item" href="#mobile-app">Mobile app</a>
        <a class="menu-item" href="#contacts">Contact us</a>
      </nav>

      <div class="header-actions">
        <button class="theme-switch" id="themeToggle" type="button" aria-label="Switch theme" aria-pressed="false">
          <span class="theme-switch__icon theme-switch__icon--sun">
            <img src="assets/icons/sun.svg" alt="" width="20" height="20">
          </span>
          <span class="theme-switch__icon theme-switch__icon--moon">
            <img src="assets/icons/moon.svg" alt="" width="20" height="20">
          </span>
        </button>

        <a class="menu-item menu-item--cta" href="#menu">
          Menu
          <img src="assets/icons/coffee-cup.svg" alt="" width="20" height="20">
        </a>

        <button class="burger-btn" id="burgerOpen" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobileMenu">
          <img src="assets/icons/menu.svg" alt="" width="16" height="8">
        </button>
      </div>
    </div>
  </header>

    <!-- Основний контент головної сторінки -->
    <main>
        <section id="hero">
            <p>Hero секція</p>
        </section>
        <!-- Інші секції додамо пізніше -->
    </main>

    <!-- Підвал сайту (спільний для обох сторінок) -->
    <footer>
        <div class="container">
            <p>Footer</p>
        </div>
    </footer>

    
</body>
</html>
